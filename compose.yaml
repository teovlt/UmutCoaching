# umut. — déploiement VPS (Dokploy), même principe que gite_manoir_champagne.
#
# Dokploy : application « Compose » sur ce dépôt (fichier compose.yaml).
# Onglet Environment : coller .env.example et le remplir (Dokploy écrit le .env lu ici).
# Onglet Domains : rattacher le sous-domaine au service « nginx », port 80, HTTPS activé.
#
# Sans Dokploy : retirer les sections dokploy-network (ou créer le réseau :
# docker network create dokploy-network), publier le port de nginx, voir le README.

services:
  # Seule entrée : /api → api, le reste → web. Seul service joint par Traefik.
  nginx:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      - web
      - api
    networks:
      - internal
      - dokploy-network

  web:
    build:
      context: .
      args:
        # Lu au build : URL canoniques et sitemap
        SITE_URL: ${SITE_URL:-https://umut.example}
    environment:
      # Le site lit son contenu (prix, photos, FAQ…) dans l'API, par le réseau interne
      API_URL: http://umut-api:4000
    expose:
      - "4321"
    restart: unless-stopped
    networks:
      internal:
        aliases:
          - umut-web

  api:
    build: ./server
    environment:
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORT: 4000
      # Traefik + nginx devant l'API
      TRUST_PROXY: 2
      UPLOAD_DIR: /app/uploads
    volumes:
      # Les photos envoyées depuis /admin survivent aux redéploiements
      - uploads:/app/uploads
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      internal:
        aliases:
          - umut-api

networks:
  # Réseau propre à la stack : web et api n'y sont joignables que par nginx
  internal:
  # Réseau de Traefik (Dokploy) : sans lui, le proxy répond « Bad Gateway »
  dokploy-network:
    external: true

volumes:
  uploads:
