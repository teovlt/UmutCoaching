# Deployed with Dokploy (Docker Compose). Traefik (Dokploy) owns ports 80/443:
# attach the domain to the `nginx` service on port 80.
# Values come from the .env next to this file (Dokploy's "Environment" tab writes it).

services:
  nginx:
    image: nginx:1.29-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    restart: always
    depends_on:
      - web
      - api

  web:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-https://umut.example}
    environment:
      # The site reads its content (prices, photos, FAQ…) from the API over the
      # internal network
      API_URL: http://api:4000
    expose:
      - "4321"
    restart: always

  api:
    build: ./server
    environment:
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORT: 4000
      # Traefik + nginx sit in front of the API
      TRUST_PROXY: 2
      UPLOAD_DIR: /app/uploads
    volumes:
      # Photos uploaded from /admin must survive redeploys
      - uploads:/app/uploads
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always

volumes:
  uploads:
