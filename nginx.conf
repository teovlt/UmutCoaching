# Single entry point behind Traefik (Dokploy): /api goes to the API, the rest
# to the Astro server. The Astro server already sends long-lived cache
# headers for its fingerprinted /_astro/ files.
# Upstreams are resolved at request time through Docker's DNS, so nginx still
# boots when one of the containers is down or not started yet. They use the
# umut-* aliases of the stack's own network: nginx is also on dokploy-network,
# shared with other projects, where a plain "web" or "api" could be another
# project's container.

server {
    listen 80 default_server;
    server_name _;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # Nothing in front of nginx compresses responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ^~ keeps the regex locations below from catching uploaded images
    location ^~ /api/ {
        set $api_upstream http://umut-api:4000;
        proxy_pass $api_upstream;
        client_max_body_size 10m;
    }

    # Kept out of search results; a header rather than a robots.txt Disallow,
    # which would stop crawlers from ever seeing the noindex
    location ~ ^/(admin|styleguide)(/.*)?$ {
        set $web_upstream http://umut-web:4321;
        proxy_pass $web_upstream;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # A location's add_header replaces the server's, so repeat them
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location / {
        set $web_upstream http://umut-web:4321;
        proxy_pass $web_upstream;
    }
}
